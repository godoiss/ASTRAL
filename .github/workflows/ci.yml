name: ASTRAL quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scientific-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      # Raw mission data, local checkpoints, and observation caches are intentionally
      # not committed. This clean-checkout suite covers portable math, contracts,
      # acquisition guards, validation logic, and persisted dossier artifacts.
      - name: Run portable scientific suite
        run: |
          python -m pytest -q \
            tests/test_candidate_intelligence.py \
            tests/test_core_math.py \
            tests/test_environment.py \
            tests/test_kepler_koi_acquisition.py \
            tests/test_mlp.py \
            tests/test_preprocessing.py \
            tests/test_scientific_validation.py \
            tests/test_stage09_design.py \
            tests/test_training.py

  atlas-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
