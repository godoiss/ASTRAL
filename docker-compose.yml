services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASTRAL_DEPLOYMENT_MODE: public_read_only
      ASTRAL_API_CORS_ORIGINS: http://127.0.0.1:3000
      ASTRAL_API_ALLOWED_HOSTS: localhost,127.0.0.1,api
      ASTRAL_FRONTEND_URL: http://127.0.0.1:3000
      ASTRAL_DISCOVERY_EXECUTION_ENABLED: "false"
      ASTRAL_DISCOVERY_DOWNLOADS_ENABLED: "false"
      ASTRAL_CANDIDATE_REVIEWS_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        ASTRAL_API_ORIGIN: http://api:8000
        ASTRAL_PUBLIC_URL: http://127.0.0.1:3000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
